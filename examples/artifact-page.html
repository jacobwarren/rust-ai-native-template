<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Task-specific artifact starter</title>
  <!-- Install foundation.css into your task bundle before using this starter. -->
  <link rel="stylesheet" href="foundation.css" data-artifact-foundation="1">
  <style>
    .comparison { display: grid; grid-template-columns: repeat(auto-fit,minmax(min(100%,18rem),1fr)); gap: var(--space-6); }
  </style>
</head>
<body><main>
  <p class="eyebrow">Replace with task and review purpose</p>
  <h1>Explain the consequential choice</h1>
  <p class="lead">Replace with source-grounded context and your own layout.</p>
  <div class="comparison">
    <section class="surface"><h2>One approach</h2><p>Evidence and tradeoffs.</p></section>
    <section class="surface"><h2>An alternative</h2><p>Different consequences.</p></section>
  </div>
  <label>What should change?<textarea placeholder="Identify the claim or choice to correct."></textarea></label>
  <p>Replace this with an appropriate task-specific response mechanism.</p>
</main></body>
</html>
